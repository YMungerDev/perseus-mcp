[project]
name = "perseus-mcp"
version = "0.1.0"
description = "MCP server giving Claude direct, citable access to Perseus Digital Library texts and lexica"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2", "lxml>=5"]

[project.scripts]
perseus-mcp = "perseus_mcp.server:main"
perseus-mcp-index = "perseus_mcp.build_index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perseus_mcp"]
